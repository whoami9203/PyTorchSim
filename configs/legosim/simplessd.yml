# Default LegoSim phase1 process definition for one NAND flash chiplet
# ("simplessd" backend -- see PyTorchSimFrontend/extension_config.py's
# CONFIG_LEGOSIM_SSD_BACKEND / CONFIG_LEGOSIM_SSD_YAML, and
# Simulator/simulator.py's _build_legosim_yaml).
#
# This is a *template* for one interchiplet phase1 process entry
# (cmd/args/log/clock_rate), not a full legosim.yml. _flash_chiplet_entries()
# loads it once and instantiates it N times -- once per NAND flash channel --
# appending each copy to the phase1 list it is already building (TOGSim, and
# optionally the DRAM simlet).
#
# Fields substituted into `args` and `log` at load time, none of which can be
# known ahead of time:
#   {channel_id}    which flash channel this process is, 0 .. N-1
#   {num_channels}  N, so the chiplet can cross-check it against its own config
#   {self_x} {self_y}   this chiplet's coordinates
#   {peer_x} {peer_y}   the NPU's coordinates
#   {offsets_path}  the per-run ssd_offsets.tsv (computed from
#                   TOGSIM_SSD_TRACE_DIR/TOGSIM_SSD_TRACE_NAME). Not used by
#                   the flash chiplet -- the NPU does the tensor->flash address
#                   translation itself now, see TOGSim/include/FlashAddressMap.h
#                   -- but still available to a replacement backend.
# Coordinates come from _legosim_layout(): the NPU is (0,0) and channel i is
# (1+i, 0). Do not hardcode them here.
#
# `args` order matches simplessd-flash-chiplet's own argv contract (see
# SimpleSSD-Standalone/sim/legosim_flash_chiplet_main.cc):
#   <SimpleSSD config> <self_x> <self_y> <peer_x> <peer_y>
#   <channel_id> <num_channels> [debug_log_path]
#
# To use a different SimpleSSD build or device config: copy this file, edit
# your copy, and point CONFIG_LEGOSIM_SSD_YAML (env var
# TOGSIM_LEGOSIM_SSD_YAML, or --ssd-yaml on the sim_*.py driver scripts) at it
# instead of editing this default in place.

cmd: /workspace/legomerged/eclab_legosim/SimpleSSD-Standalone/simplessd-flash-chiplet
args:
  - /workspace/legomerged/eclab_legosim/SimpleSSD-Standalone/simplessd/config/sample.cfg
  - "{self_x}"
  - "{self_y}"
  - "{peer_x}"
  - "{peer_y}"
  - "{channel_id}"
  - "{num_channels}"
log: flash_chiplet_{channel_id}.log
is_to_stdout: false
clock_rate: 1.0

# The device config above, repeated as a plain key so the orchestrator can read
# its [pal] Channel and spawn exactly that many chiplets -- one source of truth
# for the channel count. Override with TOGSIM_LEGOSIM_SSD_NUM_CHANNELS.
simplessd_config: /workspace/legomerged/eclab_legosim/SimpleSSD-Standalone/simplessd/config/sample.cfg
